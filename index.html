<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate 3D Mini Racing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0b0b1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .score-box, .speed-box, .record-box {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ffcc;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            backdrop-filter: blur(5px);
        }

        /* Menus */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.85);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }

        h1 {
            color: #00ffcc;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            text-align: center;
        }

        p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.9);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            width: 100%;
            justify-content: space-between;
            pointer-events: auto;
            padding-bottom: 20px;
        }

        .control-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="hud-panel">
            <div class="score-box">Холҳо: <span id="score-val">0</span></div>
            <div class="record-box">Рекорд: <span id="record-val">0</span></div>
            <div class="speed-box">Суръат: <span id="speed-val">120</span> км/с</div>
        </div>

        <div id="mobile-controls">
            <div class="control-btn" id="left-btn">←</div>
            <div class="control-btn" id="right-btn">→</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="screen-overlay">
        <h1>Mini Racing 3D</h1>
        <p>Мошинро ронед, аз монеаҳо гурезед ва хол ҷамъ кунед!</p>
        <button class="btn" onclick="startGame()">Оғози Бозӣ</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen-overlay hidden">
        <h1>Бозӣ Тамом Шуд!</h1>
        <p>Холҳои ҷамъшуда: <span id="final-score">0</span></p>
        <button class="btn" onclick="restartGame()">Боз Аз Нав</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Инициализатсияи ҳисоби сатрҳо ва сохтори бозӣ
        let scene, camera, renderer;
        let car, road, lines = [];
        let obstacles = [];
        let particles = [];
        
        let gameStarted = false;
        let isGameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('mini_racing_highscore') || 0;
        let gameSpeed = 0.6;

        let moveLeft = false;
        let moveRight = false;

        document.getElementById('record-val').innerText = highScore;

        // Синтезатори садо тавассути Web Audio API (Барои эффектҳо бидуни файли беруна)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'score') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // Сохтани муҳити 3D
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0b1a);
            scene.fog = new THREE.FogExp2(0x0b0b1a, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5.5, 9);
            camera.lookAt(0, 0, -2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Равшанӣ (Lights)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff0055, 1, 50);
            pointLight.position.set(0, 5, -5);
            scene.add(pointLight);

            // Роҳ (Road)
            const roadGeo = new THREE.PlaneGeometry(10, 300);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.8 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -100;
            road.receiveShadow = true;
            scene.add(road);

            // Хатҳои роҳ
            for (let i = -150; i < 150; i += 15) {
                const lineGeo = new THREE.BoxGeometry(0.2, 0.05, 4);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(0, 0.01, i);
                scene.add(line);
                lines.push(line);
            }

            createCar();
            createEnvironmentDecorations();

            window.addEventListener('resize', onWindowResize);
        }

        // Сохтани мошин бо ҷузъиёт
        function createCar() {
            car = new THREE.Group();

            // Баданаи асосӣ
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8, roughness: 0.2 });
            const bodyGeo = new THREE.BoxGeometry(1.4, 0.6, 2.8);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            body.castShadow = true;
            car.add(body);

            // Қисми болоии мошин (Кабина)
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const cabinGeo = new THREE.BoxGeometry(1.1, 0.4, 1.4);
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.8, -0.1);
            car.add(cabin);

            // Чароғҳои пеш
            const lightGeo = new THREE.BoxGeometry(0.3, 0.1, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            
            const lLight = new THREE.Mesh(lightGeo, lightMat);
            lLight.position.set(-0.5, 0.4, -1.4);
            car.add(lLight);

            const rLight = new THREE.Mesh(lightGeo, lightMat);
            rLight.position.set(0.5, 0.4, -1.4);
            car.add(rLight);

            car.position.set(0, 0, 2);
            scene.add(car);
        }

        // Сохтани дарахтон ва чароғҳо дар канори роҳ
        function createEnvironmentDecorations() {
            for (let i = -150; i < 150; i += 20) {
                createTree(-6, i);
                createTree(6, i);
            }
        }

        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 0.75, z);

            const leavesGeo = new THREE.ConeGeometry(1, 2.5, 5);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x00aa55 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 2.2, z);

            scene.add(trunk);
            scene.add(leaves);
        }

        // Сохтани монеаҳо дар роҳ
        function spawnObstacle() {
            if (!gameStarted || isGameOver) return;

            const obsTypes = [
                { color: 0x00ffff, w: 1.4, h: 0.8, d: 1.4 },
                { color: 0xffaa00, w: 1.2, h: 1.2, d: 1.2 }
            ];
            const type = obsTypes[Math.floor(Math.random() * obsTypes.length)];
            
            const geo = new THREE.BoxGeometry(type.w, type.h, type.d);
            const mat = new THREE.MeshStandardMaterial({ color: type.color, metalness: 0.5 });
            const obs = new THREE.Mesh(geo, mat);

            const lanes = [-3, 0, 3];
            obs.position.x = lanes[Math.floor(Math.random() * lanes.length)];
            obs.position.y = type.h / 2;
            obs.position.z = -120;
            obs.castShadow = true;

            scene.add(obs);
            obstacles.push(obs);

            // Вақти пайдошавии монеаи нав вобаста ба суръат тағйир меёбад
            let nextTime = Math.max(800, 2000 - (score * 5));
            setTimeout(spawnObstacle, nextTime);
        }

        // Идоракунии клавиатура ва ламс
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        });

        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        leftBtn.addEventListener('touchstart', () => { moveLeft = true; });
        leftBtn.addEventListener('touchend', () => { moveLeft = false; });
        rightBtn.addEventListener('touchstart', () => { moveRight = true; });
        rightBtn.addEventListener('touchend', () => { moveRight = false; });

        // Аниматсия ва мантиқи асосии бозӣ
        function animate() {
            if (!gameStarted) return;
            requestAnimationFrame(animate);

            if (!isGameOver) {
                // Ҳаракати мошин ба паҳлӯҳо
                if (moveLeft && car.position.x > -3.8) car.position.x -= 0.18;
                if (moveRight && car.position.x < 3.8) car.position.x += 0.18;

                // Намуди мошин каме ба тарафи гардиш каҷ мешавад
                car.rotation.y = (moveLeft ? 0.2 : 0) + (moveRight ? -0.2 : 0);

                // Ҳаракати хатҳои роҳ
                lines.forEach(line => {
                    line.position.z += gameSpeed;
                    if (line.position.z > 10) line.position.z = -140;
                });

                // Ҳаракати монеаҳо
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].position.z += gameSpeed;

                    // Санҷиши бархӯрд (Collision Detection)
                    if (Math.abs(car.position.x - obstacles[i].position.x) < 1.1 &&
                        Math.abs(car.position.z - obstacles[i].position.z) < 1.8) {
                        triggerGameOver();
                    }

                    // Агар монеа аз мошин гузарад, хол илова мешавад
                    if (obstacles[i].position.z > 5) {
                        scene.remove(obstacles[i]);
                        obstacles.splice(i, 1);
                        score += 10;
                        document.getElementById('score-val').innerText = score;
                        playSound('score');

                        // Зудшавии бозӣ бо зиёд шудани холҳо
                        gameSpeed = 0.6 + Math.floor(score / 100) * 0.1;
                        document.getElementById('speed-val').innerText = Math.round(120 + (gameSpeed - 0.6) * 150);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            gameStarted = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 0.6;
            document.getElementById('score-val').innerText = score;
            animate();
            setTimeout(spawnObstacle, 1500);
        }

        function triggerGameOver() {
            isGameOver = true;
            playSound('crash');
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-screen').classList.remove('hidden');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('mini_racing_highscore', highScore);
                document.getElementById('record-val').innerText = highScore;
            }
        }

        function restartGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            car.position.x = 0;
            document.getElementById('gameover-screen').classList.add('hidden');
            startGame();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initThree;
    </script>
</body>
</html>
